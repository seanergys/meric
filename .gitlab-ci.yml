# MERIC CI pipeline loader

variables:
  CI_MERIC_FETCH_CI_FILES: "1"
  CI_MERIC_PIPELINE_REPO_PATH: "energy-efficiency/meric-suite/MERIC-RS-CICD"
  CI_MERIC_PIPELINE_REPO_REF: "main"

workflow:
  rules:
    # Merge requests targeting the dev branch.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_PATH == "vys0053/meric" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
      changes:
        # Ignore documentation, Git metadata and issue templates.
        regexp: &pipeline_relevant_change
          '\A(?!(?:(?:.*/)?README\.md|CHANGELOG|LICENSE|REUSE\.toml|LICENSES/.*|\.gitlab/.*|\.git(?!lab-ci\.yml\z)[^/]*)\z).+\z'
      variables:
        CI_MERIC_TEST_PROFILE: "full"
      when: always

    # Merge requests targeting the master branch.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_PATH == "vys0053/meric" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"'
      changes:
        regexp: *pipeline_relevant_change
      variables:
        CI_MERIC_TEST_PROFILE: "full"
      when: always

    # Merge requests targeting the seanergys branch.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_PATH == "vys0053/meric" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "seanergys"'
      changes:
        regexp: *pipeline_relevant_change
      variables:
        CI_MERIC_TEST_PROFILE: "seanergys-only"
      when: always

    # Any branch can be tested manually from the GitLab UI.
    - if: '$CI_PIPELINE_SOURCE == "web"'
      variables:
        CI_MERIC_TEST_PROFILE: "full"
      when: always

    - when: never

include:
  - project: "energy-efficiency/meric-suite/MERIC-RS-CICD"
    ref: "main"
    file: "/.gitlab-ci.yml"
  - component: code.it4i.cz/energy-efficiency/ci-lint-component/lint-mr@2.1.0
    inputs:
      exclude: "src/basis/json.*,waf,tools/*,extern/*"
      build_command: "./waf configure build -v"
